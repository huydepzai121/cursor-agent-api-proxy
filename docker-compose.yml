services:
  cursor-agent-api:
    build: .
    ports:
      - "${PORT:-4646}:4646"
    environment:
      - PORT=4646
      - PROXY_API_KEY=${PROXY_API_KEY:-}
      - CURSOR_DEBUG=${CURSOR_DEBUG:-}
    volumes:
      # Mount Cursor CLI credentials from host
      - ${HOME}/.cursor-cli:/root/.cursor-cli:ro
    restart: unless-stopped
